name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: chaosagent_test
          POSTGRES_PASSWORD: chaosagent
          POSTGRES_USER: chaosagent
        options: >-
          --health-cmd "pg_isready -U chaosagent -d chaosagent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      CHAOSAGENT_ALLOW_DESTRUCTIVE_DATABASE_TESTS: '1'
      CHAOSAGENT_TEST_DATABASE_URL: postgresql+psycopg://chaosagent:chaosagent@127.0.0.1:5432/chaosagent_test
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: '0.12.1'
          python-version: '3.12'

      - name: Install Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Type-check
        run: make typecheck

      - name: Test
        run: make test

[project]
name = "chaosagent-persistence"
version = "0.0.0"
description = "PostgreSQL persistence adapter for ChaosAgent contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "chaosagent-evidence",
    "chaosagent-scenarios",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.52",
]

[tool.uv.sources]
chaosagent-evidence = { workspace = true }
chaosagent-scenarios = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_persistence"]

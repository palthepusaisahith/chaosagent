[project]
name = "chaosagent-faults"
version = "0.0.0"
description = "Deterministic provider-neutral fault rule compiler and matcher for ChaosAgent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chaosagent-scenarios",
    "rfc8785==0.1.4",
]

[tool.uv.sources]
chaosagent-scenarios = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_faults"]

[project]
name = "chaosagent-fixtures"
version = "0.0.0"
description = "Versioned deterministic synthetic-company fixtures for ChaosAgent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "rfc8785==0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_fixtures"]

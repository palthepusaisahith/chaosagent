[project]
name = "chaosagent-evaluators"
version = "0.0.0"
description = "Deterministic critical evaluators for ChaosAgent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chaosagent-evidence",
    "chaosagent-faults",
    "chaosagent-agent-runtime",
    "chaosagent-persistence",
    "chaosagent-scenarios",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "rfc8785==0.1.4",
    "sqlalchemy==2.0.52",
]

[tool.uv.sources]
chaosagent-evidence = { workspace = true }
chaosagent-faults = { workspace = true }
chaosagent-agent-runtime = { workspace = true }
chaosagent-persistence = { workspace = true }
chaosagent-scenarios = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_evaluators"]

[tool.hatch.build.targets.wheel.force-include]
"src/chaosagent_evaluators/schema" = "chaosagent_evaluators/schema"

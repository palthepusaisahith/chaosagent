[project]
name = "chaosagent-exports"
version = "0.0.0"
description = "Deterministic offline-verifiable evidence bundles for ChaosAgent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chaosagent-agent-configurations",
    "chaosagent-evidence",
    "chaosagent-evaluators",
    "chaosagent-faults",
    "chaosagent-persistence",
    "chaosagent-scenarios",
    "jsonschema==4.26.0",
    "rfc8785==0.1.4",
    "sqlalchemy==2.0.52",
]

[tool.uv.sources]
chaosagent-agent-configurations = { workspace = true }
chaosagent-evidence = { workspace = true }
chaosagent-evaluators = { workspace = true }
chaosagent-faults = { workspace = true }
chaosagent-persistence = { workspace = true }
chaosagent-scenarios = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_exports"]

[tool.hatch.build.targets.wheel.force-include]
"src/chaosagent_exports/schema/export-manifest-v0.schema.json" = "chaosagent_exports/schema/export-manifest-v0.schema.json"

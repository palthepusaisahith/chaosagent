[project]
name = "chaosagent-telemetry"
version = "0.0.0"
description = "Failure-isolated OpenTelemetry conventions and bootstrap for ChaosAgent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-sdk==1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_telemetry"]

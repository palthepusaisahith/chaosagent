[project]
name = "chaosagent-agent-configurations"
version = "0.0.0"
description = "Versioned immutable hosted-agent configuration contracts for ChaosAgent"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0", "rfc8785==0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_agent_configurations"]

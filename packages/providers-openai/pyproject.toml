[project]
name = "chaosagent-provider-openai"
version = "0.0.0"
description = "OpenAI Responses API adapter for ChaosAgent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chaosagent-agent-configurations",
    "chaosagent-agent-runtime",
    "openai==3.0.0",
]

[tool.uv.sources]
chaosagent-agent-configurations = { workspace = true }
chaosagent-agent-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_provider_openai"]

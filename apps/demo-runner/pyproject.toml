[project]
name = "chaosagent-demo-runner"
version = "0.0.0"
description = "Deterministic local flagship demo orchestration for ChaosAgent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "chaosagent-agent-runtime",
    "chaosagent-evidence",
    "chaosagent-evaluators",
    "chaosagent-faults",
    "chaosagent-fixtures",
    "chaosagent-persistence",
    "chaosagent-policies",
    "chaosagent-scenarios",
    "chaosagent-tool-gateway",
    "sqlalchemy==2.0.52",
]

[project.scripts]
chaosagent-demo = "chaosagent_demo_runner.cli:main"

[tool.uv.sources]
chaosagent-agent-runtime = { workspace = true }
chaosagent-evidence = { workspace = true }
chaosagent-evaluators = { workspace = true }
chaosagent-faults = { workspace = true }
chaosagent-fixtures = { workspace = true }
chaosagent-persistence = { workspace = true }
chaosagent-policies = { workspace = true }
chaosagent-scenarios = { workspace = true }
chaosagent-tool-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaosagent_demo_runner"]
